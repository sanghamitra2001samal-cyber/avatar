<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <rect width="400" height="400" fill="url(#grid)"/>
  
  <!-- World Map Abstract Hints -->
  <path d="M 50 100 Q 100 50 150 100 T 250 100 T 350 150" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <path d="M 20 200 Q 120 150 220 200 T 380 200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Studio Lights -->
  <circle cx="50" cy="50" r="100" fill="url(#bgGrad)" fill-opacity="0.5" filter="blur(20px)"/>
</svg>